[package]
name = "twili-recipes"
version = "0.2.5"
description = "Twili Recipes"
authors = ["kandrelczyk"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = {features = [] , version = "2.0.3" }

[dependencies]
recipes_common = { path = "../common" }
tauri = { features = ["image-png", "unstable"] , version = "2.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = {version = "0.12.4", features = ["rustls-tls"], default-features = false }
reqwest_dav = {version = "0.1.9", features = ["rustls-tls"], default-features = false }
async-trait = "0.1.80"
uuid = {version = "1.8.0", features = ["v4"] }
tauri-plugin-cli = "2.0.1"
tauri-plugin-devtools = "2.0.0"
tauri-plugin-store = "2.1.0"
tauri-plugin-shell = "2.0.2"
tauri-plugin-log = "2.0.1"
tauri-plugin-keep-screen-on = "0.1.3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.3.1"
