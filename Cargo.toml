[package]
name = "twili-recipes-ui"
version = "0.2.9"
edition = "2021"

[dependencies]
log = "0.4"
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_router = "0.8"
leptos_meta = "0.8"
leptos-use = { version = "0.16.2", features = ["use_media_query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.113"
serde-wasm-bindgen = "0.6"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_log = "1.0.0"
recipes_common = { path = "./common" }
console_error_panic_hook = "0.1.7"
icondata_bi = "0.0.10"
icondata_ri = "0.0.10"
thaw = { git = "https://github.com/kandrelczyk/thaw", branch = "v0.5-beta",  features = ["csr", "nightly"]}
web-sys = "0.3.70"
uuid = "1.16.0"

[dev-dependencies]
tokio = {version = "1.35.0", features = ["rt", "macros"]}
thirtyfour = "0.34.0"
sysinfo = "0.30.5"
mockito = "1.5.0"
serial_test = "3.1.1"

[workspace]
members = [ "common","src-tauri"]
