stages:
  - prepare
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  NDK_VERSION: "27.0.12077973"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/build-artifacts"

# =============================================================================
# PREPARE STAGE - Extract Version
# =============================================================================
prepare-version:
  stage: prepare
  image: node:lts-alpine
  rules:
    - if: $CI_COMMIT_TAG
      when: never
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
    - echo "Building version $APP_VERSION"
    - echo "APP_VERSION=${APP_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# =============================================================================
# BUILD STAGE
# =============================================================================

# Linux Build
build-linux:
  stage: build
  image: ubuntu:22.04
  needs:
    - job: prepare-version
      artifacts: true
    - job: sign-android
  cache:
    key: linux-build
    paths:
      - .cargo/
      - target/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PLATFORM: "linux"
    INCLUDE_UPDATER_JSON: "true"
    NO_STRIP: "true"
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - apt-get update
    - apt-get install -y curl wget file build-essential pkg-config libssl-dev libwebkit2gtk-4.0-dev
        libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf jq ca-certificates gnupg xdg-utils
    # Install Node.js 20 LTS from NodeSource
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
  script:
    - source "$CARGO_HOME/env"
    # Install build tools
    - cargo install --path .
    - cargo install tauri-cli --version "^2" --locked
    - cargo install trunk
    - npm install -g tailwindcss@3.4.17
    - rustup target add wasm32-unknown-unknown
    # Build with signing key
    - |
      # Require signing key
      if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
        echo "ERROR: TAURI_SIGNING_PRIVATE_KEY environment variable is not set"
        exit 1
      fi

      SIGNING_KEY_FILE="$(mktemp)"
      echo -n "$TAURI_SIGNING_PRIVATE_KEY"  > "$SIGNING_KEY_FILE"
      chmod 600 "$SIGNING_KEY_FILE"
      export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY_FILE"
      echo "Signing key file: $TAURI_SIGNING_PRIVATE_KEY"

      # Build using tauri-build script
      chmod +x ./scripts/tauri-build.sh
      ./scripts/tauri-build.sh build
      ./scripts/tauri-build.sh collect

      # Generate latest.json for updater
      export DOWNLOAD_BASE_URL="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/releases/${APP_VERSION}/downloads"
      ./scripts/tauri-build.sh generate-json
  artifacts:
    paths:
      - build-artifacts/
      - src-tauri/target/release/bundle/
    expire_in: 1 week

# Android Build
build-android:
  stage: build
  image: ubuntu:22.04
  needs:
    - job: prepare-version
      artifacts: true
  cache:
    key: android-build
    paths:
      - .cargo/
      - target/
      - android-sdk/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
    PLATFORM: "android"
  before_script:
    - apt-get update
    - apt-get install -y curl build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev
        libxdo-dev libayatana-appindicator3-dev librsvg2-dev wget unzip file
        openjdk-21-jdk jq ca-certificates gnupg
    # Install Node.js 20 LTS from NodeSource
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    # Install Rust nightly
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
    - source "$CARGO_HOME/env"
    # Setup Android SDK
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -O cmdline-tools.zip
    - unzip -qo cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses || true
    - sdkmanager "platform-tools" "platforms;android-34" "ndk;${NDK_VERSION}" "build-tools;35.0.0-rc4"
  script:
    - source "$CARGO_HOME/env"
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - export NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}
    - export TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
    - export TARGET=aarch64-linux-android
    - export API=33
    - export AR=$TOOLCHAIN/bin/llvm-ar
    - export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
    - export AS=$CC
    - export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
    - export LD=$TOOLCHAIN/bin/ld
    - export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
    - export STRIP=$TOOLCHAIN/bin/llvm-strip
    - export PATH=$PATH:$TOOLCHAIN/bin
    # Configure Cargo for Android
    - mkdir -p $HOME/.cargo
    - |
      cat > $HOME/.cargo/config.toml << EOF
      [target.aarch64-linux-android]
      linker = "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
      EOF
    # Install Rust targets
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android wasm32-unknown-unknown
    # Install build tools
    - cargo install --path .
    - cargo install tauri-cli --version "^2" --locked
    - cargo install trunk
    - npm install -g tailwindcss@3.4.17
    # Build Android app
    - chmod 777 -R ./src-tauri
    - cargo tauri android init
    - cargo tauri icon icon.png
    - ./copy-android.sh
    - cargo tauri android build
    # Collect unsigned APK
    - mkdir -p build-artifacts
    - APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
    - cp "$APK_PATH" "build-artifacts/app-unsigned.apk"
  artifacts:
    paths:
      - build-artifacts/
    expire_in: 1 week

# Download Keystore
download-keystore:
  stage: build
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-android
  rules:
    - if: $CI_COMMIT_TAG
      when: never
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_FQDN --api-protocol $CI_SERVER_PROTOCOL
    - mkdir -p .secure_files
    - glab -R $CI_PROJECT_PATH securefile download --all --output-dir ".secure_files/"
  artifacts:
    paths:
      - .secure_files/
    expire_in: 1 hour

# Android APK Signing
sign-android:
  stage: build
  image: ubuntu:22.04
  needs:
    - job: prepare-version
      artifacts: true
    - job: build-android
      artifacts: true
    - job: download-keystore
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  before_script:
    - apt-get update && apt-get install -y curl unzip openjdk-17-jre-headless
    # Download Android build-tools for apksigner
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - curl -sL https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -o cmdline-tools.zip
    - unzip -qo cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0-rc4"
  script:
    # Sign the APK
    - |
      KEYSTORE_PATH=".secure_files/app-keystore.jks"
      if [ ! -f "$KEYSTORE_PATH" ]; then
        echo "ERROR: Keystore file not found"
        exit 1
      fi
      $ANDROID_HOME/build-tools/35.0.0-rc4/apksigner sign \
        --ks "$KEYSTORE_PATH" \
        --ks-key-alias app \
        --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
        --key-pass env:ANDROID_KEYSTORE_PASSWORD \
        --out "build-artifacts/TwiliRecipes-${APP_VERSION}.apk" \
        "build-artifacts/app-unsigned.apk"
    - rm build-artifacts/app-unsigned.apk
  artifacts:
    paths:
      - build-artifacts/
    expire_in: 1 week

# =============================================================================
# PUBLISH STAGE - Upload Assets and Finalize Release
# =============================================================================
publish-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: prepare-version
      artifacts: true
    - job: build-linux
      artifacts: true
    - job: sign-android
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
#    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - echo "Publishing release ${APP_VERSION}"
    - glab auth login --token $PROJECT_TOKEN --hostname $CI_SERVER_FQDN --api-protocol $CI_SERVER_PROTOCOL
    - glab auth status
    # Prepare release notes
    - cat latest.md > release_notes.md || echo "No release notes" > release_notes.md
    # Build asset arguments
    - |
      ASSET_FILES=""
      for file in build-artifacts/*; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          # Skip unsigned APKs
          case "$filename" in
            *unsigned*)
              echo "Skipping: $filename"
              continue
              ;;
          esac
          echo "Will upload: $filename"
          ASSET_FILES="$ASSET_FILES $file"
        fi
      done
    # Create release with assets
    - |
      glab -R $CI_PROJECT_PATH release create "${APP_VERSION}" \
        --name "Twili Recipes v${APP_VERSION}" \
        --notes-file release_notes.md \
        $ASSET_FILES
  artifacts:
    paths:
      - build-artifacts/
    expire_in: 4 weeks
