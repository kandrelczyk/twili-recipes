stages:
  - prepare
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  NDK_VERSION: "27.0.12077973"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/build-artifacts"

# =============================================================================
# PREPARE STAGE - Create Release
# =============================================================================
create-release:
  stage: prepare
  image: node:lts
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y curl jq
  script:
    - export APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
    - echo "Creating release for version $APP_VERSION"
    - |
      RELEASE_NOTES=$(cat latest.md)

      # Create GitLab release using API
      curl --silent --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"Twili Recipes v${APP_VERSION}\",
          \"tag_name\": \"${APP_VERSION}\",
          \"description\": $(echo "$RELEASE_NOTES" | jq -Rs .),
          \"ref\": \"${CI_COMMIT_SHA}\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" || true

      echo "APP_VERSION=${APP_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# =============================================================================
# BUILD STAGE
# =============================================================================

# Linux Build
build-linux:
  stage: build
  image: ubuntu:22.04
  needs:
    - job: create-release
      artifacts: true
  cache:
    key: linux-build
    paths:
      - .cargo/
      - target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PLATFORM: "linux"
    INCLUDE_UPDATER_JSON: "true"
    NO_STRIP: "true"
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - apt-get update
    - apt-get install -y curl wget file build-essential pkg-config libssl-dev libwebkit2gtk-4.0-dev
        libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf jq ca-certificates gnupg xdg-utils
    # Install Node.js 20 LTS from NodeSource
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
    - source "$CARGO_HOME/env"
  script:
    - source "$CARGO_HOME/env"
    # Install build tools
    - cargo install --path .
    - cargo install tauri-cli --version "^2.0.0" --locked
    - cargo install trunk
    - npm install -g tailwindcss@3.4.17
    - rustup target add wasm32-unknown-unknown
    # Build using tauri-build script
    - chmod +x ./scripts/tauri-build.sh
    - ./scripts/tauri-build.sh build
    - ./scripts/tauri-build.sh collect
    # Generate latest.json for updater
    - |
      export DOWNLOAD_BASE_URL="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/releases/${APP_VERSION}/downloads"
      ./scripts/tauri-build.sh generate-json
  artifacts:
    paths:
      - build-artifacts/
      - src-tauri/target/release/bundle/
    expire_in: 1 week

# Android Build
build-android:
  stage: build
  image: ubuntu:22.04
  needs:
    - job: create-release
      artifacts: true
  cache:
    key: android-build
    paths:
      - .cargo/
      - target/
      - android-sdk/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
    PLATFORM: "android"
  before_script:
    - apt-get update
    - apt-get install -y curl build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev
        libxdo-dev libayatana-appindicator3-dev librsvg2-dev wget unzip file
        openjdk-21-jdk jq ca-certificates gnupg
    # Install Node.js 20 LTS from NodeSource
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    # Install Rust nightly
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
    - source "$CARGO_HOME/env"
    # Setup Android SDK
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest || true
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses || true
    - sdkmanager "platform-tools" "platforms;android-34" "ndk;${NDK_VERSION}" "build-tools;35.0.0-rc4"
  script:
    - source "$CARGO_HOME/env"
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - export NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}
    - export TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
    - export TARGET=aarch64-linux-android
    - export API=33
    - export AR=$TOOLCHAIN/bin/llvm-ar
    - export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
    - export AS=$CC
    - export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
    - export LD=$TOOLCHAIN/bin/ld
    - export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
    - export STRIP=$TOOLCHAIN/bin/llvm-strip
    - export PATH=$PATH:$TOOLCHAIN/bin
    # Configure Cargo for Android
    - mkdir -p $HOME/.cargo
    - |
      cat > $HOME/.cargo/config.toml << EOF
      [target.aarch64-linux-android]
      linker = "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
      EOF
    # Install Rust targets
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android wasm32-unknown-unknown
    # Install build tools
    - cargo install --path .
    - cargo install tauri-cli --version "^2.0.0" --locked
    - cargo install trunk
    - npm install -g tailwindcss@3.4.17
    # Build Android app
    - chmod 777 -R ./src-tauri
    - cargo tauri android init
    - cargo tauri icon icon.png
    - ./copy-android.sh
    - cargo tauri android build
    # Collect artifacts using tauri-build script
    - chmod +x ./scripts/tauri-build.sh
    - ./scripts/tauri-build.sh collect
    # Download secure files (keystore)
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    # Sign the APK
    - |
      KEYSTORE_PATH="$CI_PROJECT_DIR/.secure_files/app-keystore.jks"
      if [ -f "$KEYSTORE_PATH" ]; then
        APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
        $ANDROID_HOME/build-tools/35.0.0-rc4/apksigner sign \
          --ks "$KEYSTORE_PATH" \
          --ks-key-alias app \
          --ks-pass pass:${ANDROID_KEYSTORE_PASSWORD} \
          --key-pass pass:${ANDROID_KEYSTORE_PASSWORD} \
          --out build-artifacts/TwiliRecipes-${APP_VERSION}.apk \
          "$APK_PATH"
      else
        # Copy unsigned APK if no secure file available
        APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
        cp "$APK_PATH" "build-artifacts/TwiliRecipes-${APP_VERSION}-unsigned.apk" || true
      fi
  artifacts:
    paths:
      - build-artifacts/
      - src-tauri/gen/android/app/build/outputs/apk/
    expire_in: 1 week

# =============================================================================
# PUBLISH STAGE - Upload Assets and Finalize Release
# =============================================================================
publish-release:
  stage: publish
  image: node:lts-alpine
  needs:
    - job: create-release
      artifacts: true
    - job: build-linux
      artifacts: true
    - job: build-android
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - echo "Publishing release ${APP_VERSION}"
    - |
      # Upload all artifacts from build-artifacts directory
      for file in build-artifacts/*; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "Uploading $filename..."

          # Upload file to project uploads
          upload_response=$(curl --silent --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --form "file=@${file}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads")

          file_path=$(echo "$upload_response" | jq -r '.full_path // empty')

          if [ -n "$file_path" ]; then
            echo "Uploaded: $filename"

            # Determine link type based on file extension
            link_type="other"
            case "$filename" in
              *.deb|*.rpm|*.AppImage|*.apk) link_type="package" ;;
              *.json) link_type="other" ;;
            esac

            # Add as release asset link
            curl --silent --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"$filename\",
                \"url\": \"${CI_SERVER_URL}${file_path}\",
                \"link_type\": \"$link_type\"
              }" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${APP_VERSION}/assets/links" || echo "Warning: Could not add release link for $filename"
          else
            echo "Warning: Failed to upload $filename"
            echo "Response: $upload_response"
          fi
        fi
      done

    - echo "Release ${APP_VERSION} published successfully"
